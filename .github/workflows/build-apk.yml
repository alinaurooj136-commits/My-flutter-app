name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Save your code
        run: |
          ls -la
          FILE=$(find . -maxdepth 1 -type f -iname "*dart*" | head -1)
          echo "Found your file: $FILE"
          cp "$FILE" /tmp/mycode.dart
          ls -lh /tmp/mycode.dart
      - name: Create project
        run: flutter create . --project-name my_flutter_app --org com.example --overwrite
      - name: Restore your code
        run: |
          cp /tmp/mycode.dart lib/main.dart
          echo "Copied to lib/main.dart"
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
